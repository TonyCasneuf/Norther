
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>First Aid Kit – Inventory</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
    }

    .container {
      padding: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
    }

    th, td {
      padding: 8px;
      border-bottom: 1px solid #ddd;
      font-size: 14px;
    }

    th {
      background: #f7f7f7;
      text-align: center;
      font-weight: bold;
      vertical-align: middle;
    }

    .checkbox-cell {
      width: 80px;
      text-align: center;
      vertical-align: middle;
    }

    .checkbox-cell input[type="checkbox"] {
      transform: scale(1.4);
      cursor: pointer;
    }

    .location-cell {
      font-weight: bold;
      color: #333;
      width: 80px;
      text-align: center;
    }

    .location-line {
      display: block;
      line-height: 1.4;
    }

    .name-cell {
      font-weight: 600;
      text-align: left;
    }

    .qty-cell {
      text-align: left;
    }

    .expiry-cell {
      text-align: left;
    }

    .expiry-input {
      padding: 4px 8px;
      font-size: 14px;
      border: 1px solid #1e73be;
      border-radius: 4px;
      width: 120px;
    }

    @media (max-width: 480px) {
      th, td {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <table id="inventoryTable">
      <thead>
        <tr>
          <th>Checked</th>
          <th>Location</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <!-- Example item: Row 1 - Checkbox, Location & Name -->
        <tr>
          <td class="checkbox-cell" rowspan="3">
            <input type="checkbox" />
          </td>
          <td class="location-cell" rowspan="3">
            <span class="location-line">Pouch</span>
            <span class="location-line">A</span>
          </td>
          <td class="name-cell">Sterile gauze pads</td>
        </tr>
        <!-- Row 2 - Qty -->
        <tr>
          <td class="qty-cell">Qty: 10</td>
        </tr>
        <!-- Row 3 - Expiry Date -->
        <tr>
          <td class="expiry-cell">Expiry: <input type="date" class="expiry-input" value="2028-05-31" /></td>
        </tr>

        <!-- Second item: Row 1 - Checkbox, Location & Name -->
        <tr>
          <td class="checkbox-cell" rowspan="3">
            <input type="checkbox" />
          </td>
          <td class="location-cell" rowspan="3">
            <span class="location-line">Pouch</span>
            <span class="location-line">A</span>
          </td>
          <td class="name-cell">Adhesive bandages</td>
        </tr>
        <!-- Row 2 - Qty -->
        <tr>
          <td class="qty-cell">Qty: 25</td>
        </tr>
        <!-- Row 3 - Expiry Date -->
        <tr>
          <td class="expiry-cell">Expiry: <input type="date" class="expiry-input" value="2027-11-15" /></td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
