<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>First Aid Kit – Inventory</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
    }

    .container {
      padding: 12px;
    }

    header {
      background: #0057a8;
      color: #fff;
      padding: 14px 12px;
      border-radius: 10px;
      margin-bottom: 12px;
      text-align: center;
    }

    header h1,
    header h2 {
      margin: 0;
      letter-spacing: 0.5px;
    }

    header h2 {
      margin-top: 4px;
      font-size: 16px;
      font-weight: 600;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
    }

    th, td {
      padding: 8px;
      border-bottom: 1px solid #ddd;
      font-size: 14px;
    }

    th {
      background: #f7f7f7;
      text-align: center;
      font-weight: bold;
      vertical-align: middle;
    }

    .item-row {
      transition: all 0.3s ease;
    }

    .item-row.checked {
      background-color: #f0fdf4;
      border-left: 4px solid #22c55e;
    }

    .item-row.expired {
      background-color: #fef2f2;
      border-left: 4px solid #ef4444;
    }

    .qty-cell {
      text-align: left;
      vertical-align: middle;
    }

    .qty-check-wrap {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-left: 10px;
    }

    .qty-check-wrap input[type="checkbox"] {
      transform: scale(1.4);
      cursor: pointer;
    }

    .remark-btn {
      background: none;
      border: 1px solid #bbb;
      border-radius: 6px;
      padding: 2px 7px;
      font-size: 15px;
      cursor: pointer;
      color: #555;
      transition: background 0.15s, border-color 0.15s;
      vertical-align: middle;
    }

    .remark-btn:hover {
      background: #e8f0fb;
      border-color: #0057a8;
    }

    .remark-btn.has-remark {
      border-color: #0057a8;
      color: #0057a8;
      background: #e8f0fb;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-box {
      background: #fff;
      border-radius: 14px;
      padding: 24px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.2);
    }

    .modal-box h3 {
      margin: 0 0 14px;
      font-size: 17px;
      color: #0057a8;
    }

    .modal-box textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      resize: vertical;
      min-height: 90px;
      font-family: Arial, sans-serif;
    }

    .modal-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 14px;
    }

    .modal-buttons button {
      padding: 8px 18px;
      border: none;
      border-radius: 7px;
      font-size: 14px;
      cursor: pointer;
    }

    .modal-buttons .btn-save {
      background: #0057a8;
      color: #fff;
    }

    .modal-buttons .btn-save:hover {
      background: #003d7a;
    }

    .modal-buttons .btn-cancel {
      background: #e5e5e5;
      color: #333;
    }

    .modal-buttons .btn-cancel:hover {
      background: #ccc;
    }

    .location-cell {
      font-weight: bold;
      color: #333;
      width: 50px;
      text-align: center;
    }

    .location-line {
      display: block;
      line-height: 1.4;
    }

    .name-cell {
      font-weight: 600;
      text-align: left;
    }

    .expiry-cell {
      text-align: left;
    }

    .expiry-label {
      display: inline;
      white-space: nowrap;
      margin-right: 1px;
    }

    .expiry-input {
      padding: 4px 8px;
      font-size: 14px;
      border: 1px solid #1e73be;
      border-radius: 4px;
      width: 130px;
    }

    .expiry-input.expired {
      border-color: #ef4444;
      background-color: #fef2f2;
      color: #991b1b;
    }

    .expiry-input.valid {
      border-color: #22c55e;
      background-color: #f0fdf4;
    }

    /* Requested button styling */
    .action-buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 16px;
    }

    .action-btn {
      width: 100%;
      background: #0057a8;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .action-btn:hover {
      background: #003d7a;
    }

    .layout-modal-box {
      width: min(95vw, 1100px);
      max-width: 1100px;
      max-height: 90vh;
      overflow: auto;
      padding: 16px;
    }

    .layout-image {
      display: block;
      width: 100%;
      height: auto;
      max-height: calc(90vh - 90px);
      object-fit: contain;
      border-radius: 10px;
      margin: 0 auto;
    }

    @media (max-width: 480px) {
      th, td {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <table id="inventoryTable">
      <thead>
          <header>
            <h1>First Aid Kit</h1>
            <h2>Inventory</h2>
          </header>
        <tr>
          <th>LoL</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
      </tbody>
    </table>

    <!-- Action buttons -->
    <div class="action-buttons">
      <button type="button" id="layout-button" class="action-btn">View Layout</button>
      <button type="button" id="submit-changes-button" class="action-btn">Submit Changes</button>
    </div>

    <!-- Layout Modal -->
    <div id="layout-modal" class="modal-overlay" style="display:none;"
         role="dialog" aria-modal="true" aria-labelledby="layout-title">
      <div class="modal-box layout-modal-box">
        <div class="layout-modal-header">
          <h3 id="layout-title">First Aid Kit Layout</h3>
          <button type="button" id="layout-close" class="layout-close"
                  aria-label="Sluit layout">&times;</button>
        </div>
        <img
          class="layout-image"
          src="https://github.com/user-attachments/assets/cd4131a6-e650-4c14-9b0d-68f7910ae239"
          alt="Layout van de First Aid Kit"
        />
      </div>
    </div>
  </div>
</body>
</html>
