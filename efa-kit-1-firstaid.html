
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>First Aid Kit – Inventory</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
    }

    .container {
      padding: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
    }

    th, td {
      padding: 8px;
      border-bottom: 1px solid #ddd;
      font-size: 14px;
    }

    th {
      background: #f7f7f7;
      text-align: center;
      font-weight: bold;
      vertical-align: middle;
    }

    .item-row {
      transition: all 0.3s ease;
    }

    /* Option 3: Checkmark icon style */
    .item-row.checked-option3 {
      background-color: #f0fdf4;
    }

    .item-row.checked-option3 td {
      color: #166534;
    }

    /* Option 5: Green left border + subtle background */
    .item-row.checked-option5 {
      background-color: #f0fdf4;
      border-left: 4px solid #22c55e;
    }

    .checkbox-cell {
      width: 80px;
      text-align: center;
      vertical-align: middle;
      position: relative;
    }

    .checkbox-cell input[type="checkbox"] {
      transform: scale(1.4);
      cursor: pointer;
    }

    .checkmark {
      display: none;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: 20px;
      color: #22c55e;
      font-weight: bold;
    }

    .item-row.checked-option3 .checkmark {
      display: block;
    }

    .item-row.checked-option3 input[type="checkbox"] {
      display: none;
    }

    .location-cell {
      font-weight: bold;
      color: #333;
      width: 80px;
      text-align: center;
    }

    .location-line {
      display: block;
      line-height: 1.4;
    }

    .name-cell {
      font-weight: 600;
      text-align: left;
    }

    .qty-cell {
      text-align: left;
    }

    .expiry-cell {
      text-align: left;
    }

    .expiry-input {
      padding: 4px 8px;
      font-size: 14px;
      border: 1px solid #1e73be;
      border-radius: 4px;
      width: 120px;
    }

    @media (max-width: 480px) {
      th, td {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <table id="inventoryTable">
      <thead>
        <tr>
          <th>Checked</th>
          <th>Location</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <!-- ITEM 1: Option 3 - Checkmark icon style -->
        <!-- Row 1 - Checkbox, Location & Name -->
        <tr class="item-row" data-item="1">
          <td class="checkbox-cell" rowspan="3">
            <input type="checkbox" class="item-checkbox" data-option="3" />
            <span class="checkmark">✓</span>
          </td>
          <td class="location-cell" rowspan="3">
            <span class="location-line">Pouch</span>
            <span class="location-line">A</span>
          </td>
          <td class="name-cell">Sterile gauze pads</td>
        </tr>
        <!-- Row 2 - Qty -->
        <tr class="item-row" data-item="1">
          <td class="qty-cell">Qty: 10</td>
        </tr>
        <!-- Row 3 - Expiry Date -->
        <tr class="item-row" data-item="1">
          <td class="expiry-cell">Expiry: <input type="date" class="expiry-input" value="2028-05-31" /></td>
        </tr>

        <!-- ITEM 2: Option 5 - Green left border + subtle background -->
        <!-- Row 1 - Checkbox, Location & Name -->
        <tr class="item-row" data-item="2">
          <td class="checkbox-cell" rowspan="3">
            <input type="checkbox" class="item-checkbox" data-option="5" />
          </td>
          <td class="location-cell" rowspan="3">
            <span class="location-line">Pouch</span>
            <span class="location-line">A</span>
          </td>
          <td class="name-cell">Adhesive bandages</td>
        </tr>
        <!-- Row 2 - Qty -->
        <tr class="item-row" data-item="2">
          <td class="qty-cell">Qty: 25</td>
        </tr>
        <!-- Row 3 - Expiry Date -->
        <tr class="item-row" data-item="2">
          <td class="expiry-cell">Expiry: <input type="date" class="expiry-input" value="2027-11-15" /></td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    // Get all checkboxes
    const checkboxes = document.querySelectorAll('.item-checkbox');
    
    checkboxes.forEach(checkbox => {
      checkbox.addEventListener('change', function() {
        const option = this.getAttribute('data-option');
        const itemNum = this.closest('tr').getAttribute('data-item');
        
        // Get all 3 rows of this item
        const rows = document.querySelectorAll(`tr[data-item="${itemNum}"]`);
        
        // Toggle the appropriate class based on option
        rows.forEach(row => {
          if (this.checked) {
            if (option === '3') {
              row.classList.add('checked-option3');
              row.classList.remove('checked-option5');
            } else if (option === '5') {
              row.classList.add('checked-option5');
              row.classList.remove('checked-option3');
            }
          } else {
            row.classList.remove('checked-option3');
            row.classList.remove('checked-option5');
          }
        });
      });
    });
  </script>
</body>
</html>
