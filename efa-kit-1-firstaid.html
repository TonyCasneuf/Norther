
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>First Aid Kit – Inventory</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
    }

    .container {
      padding: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
    }

    th, td {
      padding: 8px;
      border-bottom: 1px solid #ddd;
      font-size: 14px;
    }

    th {
      background: #f7f7f7;
      text-align: center;
      font-weight: bold;
      vertical-align: middle;
    }

    .item-row {
      transition: all 0.3s ease;
    }

    .item-row.checked {
      background-color: #f0fdf4;
      border-left: 4px solid #22c55e;
    }

    .item-row.expired {
      background-color: #fef2f2;
      border-left: 4px solid #ef4444;
    }

    .checkbox-cell {
      width: 80px;
      text-align: center;
      vertical-align: middle;
    }

    .checkbox-cell input[type="checkbox"] {
      transform: scale(1.4);
      cursor: pointer;
    }

    .location-cell {
      font-weight: bold;
      color: #333;
      width: 80px;
      text-align: center;
    }

    .location-line {
      display: block;
      line-height: 1.4;
    }

    .name-cell {
      font-weight: 600;
      text-align: left;
    }

    .qty-cell {
      text-align: left;
    }

    .expiry-cell {
      text-align: left;
    }

    .expiry-input {
      padding: 4px 8px;
      font-size: 14px;
      border: 1px solid #1e73be;
      border-radius: 4px;
      width: 120px;
    }

    .expiry-input.expired {
      border-color: #ef4444;
      background-color: #fef2f2;
      color: #991b1b;
    }

    .expiry-input.valid {
      border-color: #22c55e;
      background-color: #f0fdf4;
    }

    @media (max-width: 480px) {
      th, td {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <table id="inventoryTable">
      <thead>
        <tr>
          <th>Checked</th>
          <th>Location</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <!-- ITEM 1 -->
        <!-- Row 1 - Checkbox, Location & Name -->
        <tr class="item-row" data-item="1">
          <td class="checkbox-cell" rowspan="3">
            <input type="checkbox" class="item-checkbox" />
          </td>
          <td class="location-cell" rowspan="3">
            <span class="location-line">Pouch</span>
            <span class="location-line">A</span>
          </td>
          <td class="name-cell">Sterile gauze pads</td>
        </tr>
        <!-- Row 2 - Qty -->
        <tr class="item-row" data-item="1">
          <td class="qty-cell">Qty: 10</td>
        </tr>
        <!-- Row 3 - Expiry Date -->
        <tr class="item-row" data-item="1">
          <td class="expiry-cell">Expiry: <input type="date" class="expiry-input item-expiry" value="2028-05-31" /></td>
        </tr>

        <!-- ITEM 2 -->
        <!-- Row 1 - Checkbox, Location & Name -->
        <tr class="item-row" data-item="2">
          <td class="checkbox-cell" rowspan="3">
            <input type="checkbox" class="item-checkbox" />
          </td>
          <td class="location-cell" rowspan="3">
            <span class="location-line">Pouch</span>
            <span class="location-line">A</span>
          </td>
          <td class="name-cell">Adhesive bandages</td>
        </tr>
        <!-- Row 2 - Qty -->
        <tr class="item-row" data-item="2">
          <td class="qty-cell">Qty: 25</td>
        </tr>
        <!-- Row 3 - Expiry Date -->
        <tr class="item-row" data-item="2">
          <td class="expiry-cell">Expiry: <input type="date" class="expiry-input item-expiry" value="2027-11-15" /></td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    // Get all checkboxes
    const checkboxes = document.querySelectorAll('.item-checkbox');
    const expiryInputs = document.querySelectorAll('.item-expiry');

    // Function to check if date is expired
    function isDateExpired(dateString) {
      const date = new Date(dateString);
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      return date < today;
    }

    // Function to update expiry styling
    function updateExpiryStyle(input) {
      const itemNum = input.closest('tr').getAttribute('data-item');
      const rows = document.querySelectorAll(`tr[data-item="${itemNum}"]`);
      const isExpired = isDateExpired(input.value);

      if (isExpired) {
        input.classList.add('expired');
        input.classList.remove('valid');
        rows.forEach(row => {
          row.classList.add('expired');
          row.classList.remove('checked');
        });
      } else {
        input.classList.add('valid');
        input.classList.remove('expired');
        rows.forEach(row => {
          row.classList.remove('expired');
        });
      }
    }

    // Check expiry on load
    expiryInputs.forEach(input => {
      updateExpiryStyle(input);
    });

    // Update expiry on change
    expiryInputs.forEach(input => {
      input.addEventListener('change', function() {
        updateExpiryStyle(this);
      });
    });

    // Handle checkboxes
    checkboxes.forEach(checkbox => {
      checkbox.addEventListener('change', function() {
        const itemNum = this.closest('tr').getAttribute('data-item');
        const rows = document.querySelectorAll(`tr[data-item="${itemNum}"]`);
        const expiryInput = document.querySelector(`tr[data-item="${itemNum}"] .item-expiry`);
        const isExpired = isDateExpired(expiryInput.value);

        rows.forEach(row => {
          if (this.checked && !isExpired) {
            row.classList.add('checked');
          } else {
            row.classList.remove('checked');
          }
        });
      });
    });
  </script>
</body>
</html>
