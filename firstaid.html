<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>First Aid Kit – Inventory</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="index.css">
</head>

<body>
  <header>
      <h1>First Aid Kit</h1>
      <h2>Inventory</h2>
  </header>
  <div class="container">
    <table id="inventoryTable">
      <thead></thead>
      <tbody id="inventoryBody">
      </tbody>
    </table>
  </div>

  <!-- Action buttons -->
  <div class="action-buttons">
    <button type="button" id="layout-button" class="action-btn">View Layout</button>
    <button type="button" id="submit-changes-button" class="action-btn">Confirm Check</button>
  </div>

  <!-- Layout laten zien -->
  <div id="layout-modal" class="modal-overlay" style="display:none;"
       role="dialog" aria-modal="true" aria-labelledby="layout-title">
    <div class="modal-box layout-modal-box">
      <div class="layout-modal-header">
        <h3 id="layout-title">First Aid Kit Layout</h3>
        <button type="button" id="layout-close" class="layout-close"
                aria-label="Sluit layout">&times;</button>
      </div>
      <img
        class="layout-image"
        src="https://github.com/user-attachments/assets/cd4131a6-e650-4c14-9b0d-68f7910ae239"
        alt="Layout van de First Aid Kit"
      />
    </div>
  </div>

  <!-- Remark kader tonen -->
  <div id="remark-modal" class="modal-overlay" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="modal-heading">
    <div class="modal-box">
      <h3 id="modal-heading">Opmerking – <span id="modal-item-name"></span></h3>
      <textarea id="remark-text" aria-label="Opmerking tekst" placeholder="Voer hier uw opmerking in..."></textarea>
      <div class="modal-buttons">
        <button class="btn-cancel" id="modal-cancel">Annuleren</button>
        <button class="btn-save" id="modal-save">Opslaan</button>
      </div>
    </div>
  </div>

  <script>
    // ========== DATA ARRAY - alle gegevens in een array geplaatst ==========
    const items = [
      { location: "Pouch A", name: "Oropharyngeal airway Size 2", qty: 1, expiry: "2026-12" },
      { location: "Pouch A", name: "Oropharyngeal airway Size 3", qty: 1, expiry: "2027-02" },
      { location: "Pouch A", name: "Oropharyngeal airway Size 4", qty: 1, expiry: "2027-02" },
      { location: "Pouch A", name: "Nasopharyngeal Size 6", qty: 2, expiry: "2027-04" },
      { location: "Pouch A", name: "Nasopharyngeal Size 7", qty: 2, expiry: "2027-04" },
      { location: "Pouch A", name: "5G Lubricant Sachet", qty: 1, expiry: "2027-04" },
      { location: "Pouch A", name: "Manual suction device", qty: 1, expiry: "2027-04" },
      { location: "Pouch A", name: "Gloves", qty: 2, expiry: "2027-04" },
      { location: "Pouch B", name: "Pulse oximeter", qty: 1, expiry: "N.A" },
      { location: "Pouch B", name: "Bag-valve-mask", qty: 1, expiry: "2027-05" },
      { location: "Pouch B", name: "Russell Chest Seal", qty: 1, expiry: "2026-11" },
      { location: "Pouch B", name: "Gloves", qty: 2, expiry: "2029-01" },
      { location: "Pouch C", name: "Wound dressing, pad size 200x150mm", qty: 2, expiry: "2027-02" },
      { location: "Pouch C", name: "Wound dressing, pad size 280x200mm", qty: 2, expiry: "2027-02" },
      { location: "Pouch C", name: "Gloves", qty: 2, expiry: "2029-01" },
      { location: "Pouch C", name: "Trauma Dressing 6\"", qty: 2, expiry: "2028-02" },
      { location: "Pouch C", name: "Trauma Dressing 10cm x 400cm", qty: 2, expiry: "2027-05" },
      { location: "Pouch C", name: "Haemostatic gauze", qty: 2, expiry: "2028-06" },
      { location: "Pouch C", name: "Tourniquet", qty: 2, expiry: "N.A" },
      { location: "Pouch C", name: "Tough cut scissors", qty: 1, expiry: "N.A" },
      { location: "Pouch C", name: "Gloves", qty: 2, expiry: "2029-01" },
      { location: "Pouch D", name: "Triangular Bandage", qty: 2, expiry: "N.A" },
      { location: "Pouch D", name: "Elastic bandage", qty: 2, expiry: "N.A" },
      { location: "Pouch D", name: "Elastic self-adhesive bandage", qty: 3, expiry: "N.A" },
      { location: "Pouch D", name: "Omni Splint (Prometheus)", qty: 2, expiry: "2029-07" },
      { location: "Pouch D", name: "Cling film", qty: 1, expiry: "N.A" },
      { location: "Pouch D", name: "Ice packs", qty: 2, expiry: "2026-06" },
      { location: "Pouch D", name: "Gloves", qty: 2, expiry: "2029-01" },
      { location: "Pouch E", name: "Blanket Vacuum Packed", qty: 1, expiry: "2029-12" },
      { location: "Pouch E", name: "Pelvic binder (Splint)", qty: 1, expiry: "N.A" },
      { location: "Pouch E", name: "Gloves", qty: 2, expiry: "2029-01" },
      { location: "Pouch AED", name: "AED (Philips HeartStart FRx)", qty: 2, expiry: "2027-01" },
      { location: "Pouch AED", name: "Razor", qty: 2, expiry: "N.A" },
      { location: "Pouch AED", name: "Gloves", qty: 2, expiry: "2029-01" },
      { location: "Pouch AED", name: "Tough cut scissors", qty: 1, expiry: "N.A" },
      { location: "Pouch F", name: "Box plasters", qty: 1, expiry: "2027-06" },
      { location: "Pouch F", name: "Medical tape", qty: 1, expiry: "N.A" },
      { location: "Pouch F", name: "Emergency foil blankets", qty: 2, expiry: "N.A" },
      { location: "Pouch F", name: "Burn gel", qty: 2, expiry: "2027-03" },
      { location: "Pouch F", name: "Cleaning wipes", qty: 10, expiry: "2025-06" },
      { location: "Pouch F", name: "Sterowash sodium chloride solution", qty: 500, expiry: "2027-06" },
      { location: "Pouch F", name: "Gloves", qty: 2, expiry: "2029-01" },
      { location: "Pouch G", name: "Clinical waste bags", qty: 2, expiry: "N.A" },
      { location: "Pouch G" , name: "Gloves", qty: 2, expiry: "2029-01" },
      { location: "First Aid Kit", name: "Clipboard", qty: 1, expiry: "N.A" },
      { location: "First Aid Kit", name: "Cervical collar", qty: 1, expiry: "N.A" },
      { location: "Clipboard", name: "Pencil", qty: 1, expiry: "N.A" },
      { location: "Clipboard", name: "Patient Report Forms", qty: 5, expiry: "N.A" }
    ];

    // ========== INITIALIZATION ==========
    const kit = new URLSearchParams(window.location.search).get("kit");

    // ========== RENDER ITEMS DYNAMICALLY ==========
    const tbody = document.getElementById('inventoryBody');
    items.forEach((item, index) => {
      const itemNum = index + 1;
      const locationParts = item.location.split(' ');
      
      // Row 1: Location & Name
      const row1 = document.createElement('tr');
      row1.className = 'item-row';
      row1.setAttribute('data-item', itemNum);
      
      if (item.location) {
        const locationCell = document.createElement('td');
        locationCell.className = 'location-cell';
        locationCell.rowSpan = 3;
        locationParts.forEach(part => {
          const span = document.createElement('span');
          span.className = 'location-line';
          span.textContent = part;
          locationCell.appendChild(span);
        });
        row1.appendChild(locationCell);
      }
      
      const nameCell = document.createElement('td');
      nameCell.className = 'name-cell';
      nameCell.textContent = item.name;
      row1.appendChild(nameCell);
      
      // Row 2: Qty + Checkbox + Remark
      const row2 = document.createElement('tr');
      row2.className = 'item-row';
      row2.setAttribute('data-item', itemNum);
      
      const qtyCell = document.createElement('td');
      qtyCell.className = 'qty-cell';
      qtyCell.innerHTML = `Qty: ${item.qty} <span class="qty-check-wrap">
        <input type="checkbox" class="item-checkbox" aria-label="Item gecontroleerd" />
        <button class="remark-btn" data-item="${itemNum}" title="Opmerking toevoegen">📝</button>
      </span>`;
      row2.appendChild(qtyCell);
      
      // Row 3: Expiry Date
      const row3 = document.createElement('tr');
      row3.className = 'item-row';
      row3.setAttribute('data-item', itemNum);
      
      const expiryCell = document.createElement('td');
      expiryCell.className = 'expiry-cell';
      
      if (item.expiry === 'N.A' || item.expiry === 'N.A.') {
        expiryCell.textContent = 'Expiry: N.A';
      } else {
        const expiryLabel = document.createElement('span');
        expiryLabel.className = 'expiry-label';
        expiryLabel.textContent = 'Expiry: ';
        
        const expiryInput = document.createElement('input');
        expiryInput.type = 'month';
        expiryInput.className = 'expiry-input item-expiry';
        expiryInput.value = item.expiry;
        
        expiryCell.appendChild(expiryLabel);
        expiryCell.appendChild(expiryInput);
      }
      
      row3.appendChild(expiryCell);
      
      tbody.appendChild(row1);
      tbody.appendChild(row2);
      tbody.appendChild(row3);
    });

    // ========== HELPER FUNCTIONS ==========
    function isDateExpired(monthString) {
      if (!monthString || monthString === 'N.A' || monthString === 'N.A.') {
        return false;
      }

      const match = monthString.match(/^(\d{4})-(\d{2})$/);
      if (!match) return false;

      const year = Number(match[1]);
      const month = Number(match[2]);
      const expiryDate = new Date(year, month, 0);
      expiryDate.setHours(23, 59, 59, 999);

      return expiryDate < new Date();
    }

    function updateItemState(itemNum) {
      const rows = document.querySelectorAll(`tr[data-item="${itemNum}"]`);
      const checkbox = document.querySelector(`tr[data-item="${itemNum}"] .item-checkbox`);
      const expiryInput = document.querySelector(`tr[data-item="${itemNum}"] .item-expiry`);

      rows.forEach(row => {
        row.classList.remove('checked', 'expired');
      });

      // Check if expired first - expired takes precedence
      if (expiryInput) {
        const expired = isDateExpired(expiryInput.value);

        expiryInput.classList.toggle('expired', expired);
        expiryInput.classList.toggle('valid', !expired);

        if (expired) {
          rows.forEach(row => row.classList.add('expired'));
          return; // Don't show green if expired
        }
      }

      // Only show green (checked) if NOT expired and checkbox is checked
      if (checkbox && checkbox.checked) {
        rows.forEach(row => row.classList.add('checked'));
      }
    }

    // ========== INITIALIZE CHECKBOXES AND EXPIRY INPUTS ==========
    const checkboxes = document.querySelectorAll('.item-checkbox');
    const expiryInputs = document.querySelectorAll('.item-expiry');
    const allItemRows = document.querySelectorAll('.item-row');

    // Load saved states and attach event listeners
    expiryInputs.forEach(input => {
      const itemNum = input.closest('tr').getAttribute('data-item');
      const savedDate = localStorage.getItem(`expiry_${itemNum}`);

      if (savedDate) {
        input.value = savedDate;
      }

      updateItemState(itemNum);

      input.addEventListener('change', function() {
        localStorage.setItem(`expiry_${itemNum}`, this.value);
        updateItemState(itemNum);
      });
    });

    checkboxes.forEach(checkbox => {
      const itemNum = checkbox.closest('tr').getAttribute('data-item');
      const savedState = localStorage.getItem(`checked_${itemNum}`);

      checkbox.checked = savedState === 'true';
      updateItemState(itemNum);

      checkbox.addEventListener('change', function() {
        localStorage.setItem(`checked_${itemNum}`, String(this.checked));
        updateItemState(itemNum);
      });
    });

    // ========== REMARK MODAL FUNCTIONALITY ==========
    const remarkModal = document.getElementById('remark-modal');
    const remarkText = document.getElementById('remark-text');
    const modalItemName = document.getElementById('modal-item-name');
    let activeRemarkItem = null;

    function updateRemarkButton(itemNum) {
      const btn = document.querySelector(`.remark-btn[data-item="${itemNum}"]`);
      if (!btn) return;
      const saved = localStorage.getItem(`remark_${itemNum}`);
      btn.classList.toggle('has-remark', saved && saved.trim());
    }

    function closeModal() {
      remarkModal.style.display = 'none';
      activeRemarkItem = null;
    }

    document.querySelectorAll('.remark-btn').forEach(btn => {
      const itemNum = btn.getAttribute('data-item');
      updateRemarkButton(itemNum);

      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        activeRemarkItem = itemNum;
        const nameCell = document.querySelector(`tr[data-item="${itemNum}"] .name-cell`);
        modalItemName.textContent = nameCell ? nameCell.textContent.trim() : `Item ${itemNum}`;
        remarkText.value = localStorage.getItem(`remark_${itemNum}`) || '';
        remarkModal.style.display = 'flex';
        remarkText.focus();
      });
    });

    document.getElementById('modal-save').addEventListener('click', function() {
      if (activeRemarkItem !== null) {
        localStorage.setItem(`remark_${activeRemarkItem}`, remarkText.value);
        updateRemarkButton(activeRemarkItem);
      }
      closeModal();
    });

    document.getElementById('modal-cancel').addEventListener('click', closeModal);

    remarkModal.addEventListener('click', function(e) {
      if (e.target === remarkModal) {
        closeModal();
      }
    });

    // ========== LAYOUT MODAL FUNCTIONALITY ==========
    const layoutButton = document.getElementById('layout-button');
    const layoutModal = document.getElementById('layout-modal');
    const layoutClose = document.getElementById('layout-close');

    function closeLayoutModal() {
      layoutModal.style.display = 'none';
    }

    layoutButton.addEventListener('click', () => {
      layoutModal.style.display = 'flex';
    });

    layoutClose.addEventListener('click', closeLayoutModal);

    layoutModal.addEventListener('click', (event) => {
      if (event.target === layoutModal) {
        closeLayoutModal();
      }
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        closeLayoutModal();
      }
    });

    // ========== EXPORT TO JSON FUNCTIONALITY ==========
    document.getElementById('submit-changes-button').addEventListener('click', function() {
      const kitData = {
        kitNumber: kit || "unknown",
        kitType: "First Aid",
        lastCheck: new Date().toISOString(),
        items: []
      };

      items.forEach((item, index) => {
        const itemNum = index + 1;
        const checked = localStorage.getItem(`checked_${itemNum}`) === 'true';
        const expiry = localStorage.getItem(`expiry_${itemNum}`) || item.expiry;
        const remark = localStorage.getItem(`remark_${itemNum}`) || '';
        
        kitData.items.push({
          id: itemNum,
          location: item.location,
          name: item.name,
          quantity: item.qty,
          expiry: expiry,
          checked: checked,
          expired: isDateExpired(expiry),
          remark: remark
        });
      });

      // Save to localStorage
      localStorage.setItem(`firstaid_kit_${kit}_data`, JSON.stringify(kitData));
      
      // Also log to console for debugging
      console.log('Kit data saved:', kitData);
      
      // Show confirmation
      alert('Check bevestigd! Data opgeslagen.');
    });
  </script>
</body>
</html>
