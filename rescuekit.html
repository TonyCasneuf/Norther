<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Rescue Kit – Inventory</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="index.css">
</head>

<body>
  <header>
      <h1>Rescue Kit</h1>
      <h2>Inventory</h2>
  </header>
  <div class="container">
    <table id="inventoryTable">
      <thead></thead>
      <tbody id="inventoryBody">
        <!-- Items will be generated dynamically -->
      </tbody>
    </table>
  </div>

  <!-- Action buttons -->
  <div class="action-buttons">
    <button type="button" id="submit-changes-button" class="action-btn">Confirm Check</button>
  </div>

  <!-- Remark Modal -->
  <div id="remark-modal" class="modal-overlay" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="modal-heading">
    <div class="modal-box">
      <h3 id="modal-heading">Opmerking – <span id="modal-item-name"></span></h3>
      <textarea id="remark-text" aria-label="Opmerking tekst" placeholder="Voer hier uw opmerking in..."></textarea>
      <div class="modal-buttons">
        <button class="btn-cancel" id="modal-cancel">Annuleren</button>
        <button class="btn-save" id="modal-save">Opslaan</button>
      </div>
    </div>
  </div>

  <script>
    // ========== DATA ARRAY - All items in one place ==========
    const items = [
      { name: "Cervical collar" }
    ];

    // ========== INITIALIZATION ==========
    const kit = new URLSearchParams(window.location.search).get("kit");

    // ========== RENDER ITEMS DYNAMICALLY ==========
    const tbody = document.getElementById('inventoryBody');
    items.forEach((item, index) => {
      const itemNum = index + 1;
      
      const row = document.createElement('tr');
      row.className = 'item-row';
      row.setAttribute('data-item', itemNum);
      
      const nameCell = document.createElement('td');
      nameCell.className = 'name-cell';
      nameCell.textContent = item.name;
      
      const checkCell = document.createElement('td');
      checkCell.className = 'item-check';
      checkCell.innerHTML = '<input type="checkbox" class="item-checkbox" aria-label="Item gecontroleerd" />';
      
      const remarkCell = document.createElement('td');
      remarkCell.className = 'item-remark';
      remarkCell.innerHTML = `<button class="remark-btn" data-item="${itemNum}">📝</button>`;
      
      row.appendChild(nameCell);
      row.appendChild(checkCell);
      row.appendChild(remarkCell);
      tbody.appendChild(row);
    });

    // ========== HELPER FUNCTIONS (NO EXPIRY LOGIC NEEDED) ==========
    function updateItemState(itemNum) {
      const row = document.querySelector(`tr[data-item="${itemNum}"]`);
      const checkbox = document.querySelector(`tr[data-item="${itemNum}"] .item-checkbox`);

      row.classList.remove('checked');

      if (checkbox && checkbox.checked) {
        row.classList.add('checked');
      }
    }

    // ========== INITIALIZE CHECKBOXES ==========
    const checkboxes = document.querySelectorAll('.item-checkbox');

    checkboxes.forEach(checkbox => {
      const itemNum = checkbox.closest('tr').getAttribute('data-item');
      const savedState = localStorage.getItem(`rescue_checked_${itemNum}`);

      checkbox.checked = savedState === 'true';
      updateItemState(itemNum);

      checkbox.addEventListener('change', function() {
        localStorage.setItem(`rescue_checked_${itemNum}`, String(this.checked));
        updateItemState(itemNum);
      });
    });

    // ========== REMARK MODAL FUNCTIONALITY ==========
    const remarkModal = document.getElementById('remark-modal');
    const remarkText = document.getElementById('remark-text');
    const modalItemName = document.getElementById('modal-item-name');
    let activeRemarkItem = null;

    function updateRemarkButton(itemNum) {
      const btn = document.querySelector(`.remark-btn[data-item="${itemNum}"]`);
      if (!btn) return;
      const saved = localStorage.getItem(`rescue_remark_${itemNum}`);
      btn.classList.toggle('has-remark', saved && saved.trim());
    }

    function closeModal() {
      remarkModal.style.display = 'none';
      activeRemarkItem = null;
    }

    document.querySelectorAll('.remark-btn').forEach(btn => {
      const itemNum = btn.getAttribute('data-item');
      updateRemarkButton(itemNum);

      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        activeRemarkItem = itemNum;
        const nameCell = document.querySelector(`tr[data-item="${itemNum}"] .name-cell`);
        modalItemName.textContent = nameCell ? nameCell.textContent.trim() : `Item ${itemNum}`;
        remarkText.value = localStorage.getItem(`rescue_remark_${itemNum}`) || '';
        remarkModal.style.display = 'flex';
        remarkText.focus();
      });
    });

    document.getElementById('modal-save').addEventListener('click', function() {
      if (activeRemarkItem !== null) {
        localStorage.setItem(`rescue_remark_${activeRemarkItem}`, remarkText.value);
        updateRemarkButton(activeRemarkItem);
      }
      closeModal();
    });

    document.getElementById('modal-cancel').addEventListener('click', closeModal);

    remarkModal.addEventListener('click', function(e) {
      if (e.target === remarkModal) {
        closeModal();
      }
    });

    // ========== EXPORT TO JSON FUNCTIONALITY ==========
    document.getElementById('submit-changes-button').addEventListener('click', function() {
      const kitData = {
        kitNumber: kit || "unknown",
        kitType: "Rescue",
        lastCheck: new Date().toISOString(),
        items: []
      };

      items.forEach((item, index) => {
        const itemNum = index + 1;
        const checked = localStorage.getItem(`rescue_checked_${itemNum}`) === 'true';
        const remark = localStorage.getItem(`rescue_remark_${itemNum}`) || '';
        
        kitData.items.push({
          id: itemNum,
          name: item.name,
          checked: checked,
          remark: remark
        });
      });

      // Save to localStorage
      localStorage.setItem(`rescue_kit_${kit}_data`, JSON.stringify(kitData));
      
      // Also log to console for debugging
      console.log('Kit data saved:', kitData);
      
      // Show confirmation
      alert('Check bevestigd! Data opgeslagen.');
    });
  </script>
</body>
</html>
